  # 9. CORE TELEMETRY & SERVICES MODULE
  # ============================================================================
  - id: analytics-log-event-success
    displayName: "Log GA4 custom events through FirebaseAnalyticsService"
    steps:
      - goal: "Trigger custom telemetry event (e.g. qr_scan_completed)"
        hint: "Invoke AppAnalytics.logEvent(qr_scan_completed, {points: 100})"
        finalScreenAssertion: "Event is forwarded to FirebaseAnalytics.logEvent() with sanitized parameter map"

  - id: analytics-sanitize-pii
    displayName: "Sanitize user PII (phone number, raw QR payload) from analytics logs"
    steps:
      - goal: "Dispatch analytics event containing user mobile number"
        hint: "Pass mobile number 9876543210 to telemetry layer"
        finalScreenAssertion: "Telemetry payload strips raw mobile string and substitutes hashed identifier before reaching Firebase SDK"

  - id: analytics-fail-safe-guard
    displayName: "Catch SDK exceptions inside _guard without crashing UI"
    steps:
      - goal: "Trigger analytics call when Firebase Analytics SDK throws an error"
        hint: "Simulate FirebaseAnalytics exception during network failure"
        finalScreenAssertion: "_guard catches exception silently, logs in debug mode, and UI action completes uninterrupted"

  - id: push-notifications-foreground
    displayName: "Receive FCM push notification in foreground and show in-app toast"
    prerequisiteTestCaseId: verify-otp-correct-code
    steps:
      - goal: "Dispatch FCM push notification to device while app is open"
        hint: "Send test payload with title Points Credited and body +500 PTS added"
        finalScreenAssertion: "In-app toast banner appears displaying Points Credited: +500 PTS added and points balance auto-refreshes"

  - id: push-notifications-token-refresh
    displayName: "Update reactive fcmToken variable on token refresh stream"
    steps:
      - goal: "Simulate FCM token refresh event"
        hint: "Push new token to FirebaseMessaging.instance.onTokenRefresh stream"
        finalScreenAssertion: "PushNotificationService.fcmToken updates reactively to the new token string"

  - id: remote-config-realtime-update
    displayName: "Trigger activate() when Remote Config onConfigUpdated emits changes"
    steps:
      - goal: "Modify a Remote Config parameter in Firebase console"
        hint: "Push config update key is_maintenance_mode"
        finalScreenAssertion: "RemoteConfigService listens to update stream, executes activate(), and app state reflects new parameter value"
